$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  Bug reports, investigations, and repro notes (data/bugs/<slug>.md). Every bug
  carries a stage and a severity; no body section states lifecycle.
maxDepth: 4
sections:
  - header:
      pattern: '^Bug: '
      description: 'every bug H1 starts with "Bug: "'
    minContains: 1
    maxContains: 1
    sections:
      - header: { const: Symptom }
        minContains: 1
        description: &order-hint 'a bug body is Symptom, Reproduction, Root cause, then the optional Potential solution and Fix, in that order — a required section out of that order reports as missing'
      - header: { const: Reproduction }
        minContains: 1
        description: *order-hint
      - header: { const: Root cause }
        minContains: 1
        description: *order-hint
      - header: { const: Potential solution }
        minContains: 0
        maxContains: 1
        description: *order-hint
      - header: { const: Fix }
        minContains: 0
        maxContains: 1
        description: *order-hint
    additionalSections: true
additionalSections: false
frontmatter:
  type: object
  required: [type, stage, severity]
  properties:
    type: { const: bug }
    stage:
      enum: [pending, planned, done, cancelled]
      description: 'stage must be one of: pending, planned, done, cancelled'
    severity:
      enum: [critical, high, medium, low]
      description: 'severity must be one of: critical, high, medium, low — the impact of the defect, not its urgency'
    rank:
      type: integer
      minimum: 1
      description: 'rank must be a positive integer — the place in the global build order, lower first'
    description:
      type: string
      description: one sentence summarizing this document
    resource:
      type: string
      description: canonical URI of the underlying asset this document describes
    tags: { type: array, items: { type: string } }
    stale_after:
      type: string
      format: date
      description: the day this content goes stale; set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced — write it on every edit
      properties:
        by:
          {
            type: string,
            description: 'actor — <producer>/<version>, human:<id>, or process:<id>',
          }
        at:
          {
            type: string,
            description: ISO 8601 datetime of the last meaningful change,
          }
    verified:
      description: who confirmed the content against its sources; one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from; cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id:
            {
              type: string,
              description: footnote label used to attribute a claim in the body,
            }
          resource:
            {
              type: string,
              description: a URL,
              a repo path,
              or a scope descriptor,
            }
          title: { type: string }
          author: { type: string, description: actor }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: 'actor' }
        at: { type: string, description: ISO 8601 datetime }
