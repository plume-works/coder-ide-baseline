$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  Implementation plans, migrations, and design proposals
  (data/plans/YYYYMMDD-slug.md). Every plan carries a created date; a shipped
  plan is marked done and dated with completed.
maxDepth: 4
frontmatter:
  type: object
  required: [type, created]
  properties:
    type: { const: plan }
    stage:
      enum: [done, cancelled]
      description: 'stage must be one of: done, cancelled (omit for active/pending)'
    rank:
      type: integer
      minimum: 1
      description: 'rank must be a positive integer — the place in the global build order, lower first'
    created:
      type: string
      format: date
      description: created must be a YYYY-MM-DD date
    completed:
      type: string
      format: date
      description: completed must be a YYYY-MM-DD date
    released:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      description: 'released must be the X.Y.Z version whose release cut took this done plan'
    release:
      description: 'release must be internal, or a non-empty list of features/<slug> and bugs/<slug> keys the work adds, changes, or fixes'
      anyOf:
        - { const: internal }
        - type: array
          minItems: 1
          items:
            { type: string, pattern: '^(features|bugs)/[a-z0-9][a-z0-9.-]*$' }
    description:
      type: string
      description: one sentence summarizing this document
    resource:
      type: string
      description: canonical URI of the underlying asset this document describes
    tags: { type: array, items: { type: string } }
    stale_after:
      type: string
      format: date
      description: the day this content goes stale; set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced — write it on every edit
      properties:
        by:
          {
            type: string,
            description: 'actor — <producer>/<version>, human:<id>, or process:<id>',
          }
        at:
          {
            type: string,
            description: ISO 8601 datetime of the last meaningful change,
          }
    verified:
      description: who confirmed the content against its sources; one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from; cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id:
            {
              type: string,
              description: footnote label used to attribute a claim in the body,
            }
          resource:
            {
              type: string,
              description: a URL,
              a repo path,
              or a scope descriptor,
            }
          title: { type: string }
          author: { type: string, description: actor }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: 'actor' }
        at: { type: string, description: ISO 8601 datetime }
  if:
    required: [stage]
    properties:
      stage: { const: done }
  then:
    required: [completed]
    description: a plan marked done must carry a completed date
  anyOf:
    - required: [stage]
    - required: [release]
  description: an active plan (no stage) must declare release
