name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  schedule:
    - cron: "0 0 * * 0"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve image name
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      # GHCR rejects an uppercase path, and `github.repository` preserves the
      # case the owner and repository were created with.
      - name: Lowercase the image name
        id: name
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
    # Each architecture builds on its own native runner; emulating arm64 under
    # QEMU took roughly an order of magnitude longer.
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and push by digest
        uses: ./.github/actions/docker/build-push-action
        with:
          context: ./root-container
          image: ${{ needs.prepare.outputs.image }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    name: Merge and push manifest
    needs: [ prepare, build ]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The per-architecture builds above push by digest and tag nothing; this
      # joins those digests into the one manifest list the tags point at.
      - name: Merge and push multi-arch manifest
        uses: ./.github/actions/docker/multiarch-merge
        with:
          image: ${{ needs.prepare.outputs.image }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
