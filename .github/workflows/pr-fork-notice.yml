name: Fork publish notice

# A fork's own GITHUB_TOKEN cannot comment, so the notice is posted from the
# base repository. This workflow never checks out or runs pull request code,
# which is what makes pull_request_target safe here.
on:
  pull_request_target:
    types: [ opened, reopened, synchronize ]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  notice:
    name: Maintain fork publish notice
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the notice comment
        uses: actions/github-script@v9
        with:
          script: |
            // The marker identifies this workflow's own comment, so repeated
            // runs update the one comment instead of adding another.
            const marker = '<!-- fork-publish-notice -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const body = [
              marker,
              '### Images from this pull request are not published',
              '',
              'This pull request comes from a fork. A fork\'s `GITHUB_TOKEN` is',
              'read-only no matter what the workflow declares, so no `pr-' + issue_number + '`',
              'image is pushed to the registry.',
              '',
              'Both architectures are still built, so the build is verified by CI —',
              'the checks on this pull request are meaningful. A maintainer who needs',
              'the image can build it from this branch, or re-run the build from a',
              'branch in this repository.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
